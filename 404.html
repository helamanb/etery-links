<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etery</title>
<!--
  Pagina de recogida de los vinculos link.etery.app/l/{slug}.

  Se llama 404.html a proposito: GitHub Pages sirve ficheros estaticos y no
  existe un fichero por cada slug, asi que cualquier ruta desconocida cae aqui.
  Es el patron habitual para enlaces cortos servidos desde Pages.

  Cuando MAS se usa esta pagina es cuando NO se usa: si la persona tiene Etery
  instalada, Android abre la app directamente y esto no llega a cargarse. Aqui
  aterriza justo el caso que antes se perdia — quien todavia no la tiene.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0d0a1a; color: #ece9f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px; text-align: center;
  }
  .caja { max-width: 380px; width: 100%; }
  .rayo { font-size: 56px; line-height: 1; }
  h1 { font-size: 26px; margin: 14px 0 6px; color: #00f0ff; letter-spacing: .5px; }
  p { font-size: 15px; line-height: 1.55; color: #a9a3c4; margin: 0 0 22px; }
  .btn {
    display: block; width: 100%; padding: 15px 20px; margin-bottom: 11px;
    border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 15px;
  }
  .primario { background: #00f0ff; color: #0d0a1a; }
  .secundario { border: 1px solid rgba(0,240,255,.35); color: #00f0ff; }
  .pie { font-size: 12px; color: #6f6890; margin-top: 26px; }
  .pie a { color: #6f6890; }
</style>
</head>
<body>
  <div class="caja">
    <div class="rayo">⚡</div>
    <h1>Etery</h1>
    <p id="mensaje">Conexiones que empiezan por dentro.</p>

    <a class="btn primario"
       href="https://play.google.com/store/apps/details?id=com.aetherborea.eter">
      Descargar en Google Play
    </a>

    <!-- Por si alguien tiene la app pero Android aun no ha verificado el
         dominio (la verificacion tarda un poco tras instalar). El esquema
         propio sigue funcionando, asi que este boton la abre igual. -->
    <a class="btn secundario" id="abrirApp" href="#" hidden>Ya la tengo, abrir</a>

    <p class="pie">
      <a href="https://legal.etery.app/">Privacidad y condiciones</a>
    </p>
  </div>

<script>
  // La ruta es /l/{slug}. Se lee para poder ofrecer el enlace directo por el
  // esquema propio; el slug NO se resuelve aqui — eso lo hace la app contra
  // Supabase. Esta pagina no sabe, ni necesita saber, a donde apunta.
  var m = location.pathname.match(/^\/l\/([a-z0-9][a-z0-9_-]{1,38}[a-z0-9])\/?$/i);
  if (m) {
    var slug = m[1].toLowerCase();
    document.getElementById('mensaje').textContent =
      'Este enlace se abre dentro de la app. Instalala y volvera a funcionar.';
    var b = document.getElementById('abrirApp');
    b.href = 'etery://l/' + slug;
    b.hidden = false;
  }
</script>
</body>
</html>
